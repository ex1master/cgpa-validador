<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Validador Tarjetas de Beneficios</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="contenedor">


    <img 
        src="img/logo.png" 
        alt="Logo CGPA"
        class="logo"
    >


    <h1>
        Validador Tarjetas de Beneficios
    </h1>

    <button id="scanButton">

        📷 Escanear tarjeta

    </button>


    <div 
        id="reader" 
        style="display:none; width:100%; margin-top:20px;"
    ></div>


    <p>

        o ingrese el código manualmente
         <br>
        (recuerde respetar Mayúsculas)

    </p>


    <input

        type="text"

        id="codigo"

        placeholder="Ej: CGPA-2026-0001"

    >


    <button id="buscar">

        Validar tarjeta

    </button>



    <div id="resultado"></div>



    <div class="aviso">

        ⚠️ Es de exclusiva responsabilidad del comercio verificar la identidad de quien presenta la tarjeta.

    </div>



    <footer>


        © 2026 - Centro General de Padres y Apoderados
        <br>
        Saint Thomas College Osorno

    </footer>


</div>



<script src="https://unpkg.com/html5-qrcode"></script>

<script src="script.js"></script>


</body>

</html>
